name: Release MyBox

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The runner image ships a stable Rust toolchain, so no action installs
      # one. Fetching dtolnay/rust-toolchain failed the 0.4.0 release twice on
      # a 429, and this workflow holds the signing key, so every third-party
      # action it does without is one less thing to trust.
      - name: Show the Rust toolchain in use
        run: rustc --version && cargo --version

      - name: Install frontend dependencies
        working-directory: mybox-app
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: mybox-app
          tagName: ${{ github.ref_name }}
          releaseName: "MyBox ${{ github.ref_name }}"
          releaseBody: "See the commit history for details."
          releaseDraft: true
          prerelease: false

[package]
name = "mybox"
version = "0.6.4"
description = "A local-first toolbox for independent apps"
authors = ["MyBox contributors"]
edition = "2021"

[lib]
name = "mybox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
keyring = "4.1.6"
rand = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "rustls", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "process", "time"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.38.2"
windows = "=0.61.3"

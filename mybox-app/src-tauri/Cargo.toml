[package]
name = "mybox"
version = "0.1.0"
description = "A local-first toolbox for independent apps"
authors = ["MyBox contributors"]
edition = "2021"

[lib]
name = "mybox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tempfile = "3"
